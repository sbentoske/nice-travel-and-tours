name: Build package images

on:
  push:
    branches: [main]
    paths:
      - 'package-image-chunks/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebuild high-quality package images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/images/packages
          for dir in package-image-chunks/*; do
            [ -d "$dir" ] || continue
            slug="$(basename "$dir")"
            cat "$dir"/*.txt | tr -d '\n\r' | base64 --decode > "public/images/packages/${slug}.webp"
          done
          ls -lh public/images/packages/*.webp
      - name: Commit rebuilt images
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/images/packages
          if git diff --cached --quiet; then
            echo "No image changes to commit"
            exit 0
          fi
          git commit -m "Build high-quality package images"
          git push
